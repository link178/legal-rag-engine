[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-engine"
version = "0.1.0"
description = "Local-first RAG engine scaffold for general and legal corpora (early development)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See LICENSE file in repository root" }
authors = [{ name = "Legal RAG Engine contributors" }]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a live database (opt-in: pytest -m integration)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
