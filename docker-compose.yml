# Phase 1: local Postgres + pgvector only (no API/Streamlit services).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: legal_rag
    ports:
      - "5432:5432"
    volumes:
      - legal_rag_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  legal_rag_pgdata:
